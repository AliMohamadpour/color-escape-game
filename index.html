<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7f3ed">
<meta name="description" content="Color Escape 3D - 500 Levels">
<title>Color Escape 3D</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

:root{
 --bg:#f7f3ed;
 --surface:#fffdfb;
 --surface2:#f0eaf8;
 --purple:#a78bce;
 --purple-dark:#8064ae;
 --mint:#a8d8c6;
 --mint-dark:#6eaf98;
 --pink:#efb7c8;
 --yellow:#f4d58d;
 --text:#51465f;
 --muted:#988da0;
 --border:#e9e1eb;
 --shadow:0 8px 28px rgba(110,87,133,.10);
}
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 font-family:'Vazirmatn',Tahoma,sans-serif;
 background:var(--bg);color:var(--text);
}
button{font-family:inherit;cursor:pointer;border:0}
#app{
 width:100%;height:100%;max-width:650px;margin:auto;
 display:flex;flex-direction:column;position:relative;
 overflow:hidden;background:
 radial-gradient(circle at 10% 10%,#f5e6ef 0,transparent 28%),
 radial-gradient(circle at 90% 25%,#e8e1f5 0,transparent 30%),
 var(--bg);
}
.topbar{
 display:flex;align-items:center;justify-content:space-between;
 padding:12px 15px 8px;gap:8px;z-index:5;
}
.brand{display:flex;align-items:center;gap:9px}
.logo{
 width:39px;height:39px;border-radius:14px;
 background:linear-gradient(135deg,#c9b1e9,#f0b9ca);
 display:grid;place-items:center;color:white;font-size:22px;
 box-shadow:0 5px 12px #b49acb55;
}
.brand-name{font-weight:900;font-size:17px;line-height:1.2}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:1px}
.top-actions{display:flex;gap:7px;align-items:center}
.pill{
 display:flex;align-items:center;gap:5px;padding:8px 11px;
 border-radius:13px;background:var(--surface);
 box-shadow:var(--shadow);font-size:12px;font-weight:800;
}
.icon-btn{
 width:37px;height:37px;border-radius:12px;background:var(--surface);
 color:var(--text);font-size:17px;box-shadow:var(--shadow);
}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 13px 12px}
.level-row{
 display:flex;align-items:center;justify-content:space-between;
 padding:8px 4px 9px;
}
.level-title{font-size:13px;color:var(--muted);font-weight:700}
.level-number{
 direction:ltr;unicode-bidi:isolate;font-family:Arial,sans-serif;
 font-weight:900;font-size:23px;color:var(--purple-dark);
}
.progress-wrap{height:7px;background:#e9e2ed;border-radius:20px;overflow:hidden;margin-top:5px}
.progress{height:100%;width:0;background:linear-gradient(90deg,#b9a0df,#a7d8c7);border-radius:20px;transition:width .3s}
.game-card{
 flex:1;min-height:180px;position:relative;border-radius:25px;
 background:linear-gradient(160deg,#fffdfb,#f4eff8);
 border:1px solid #fff;box-shadow:var(--shadow);overflow:hidden;
}
#game3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.scene-tip{
 position:absolute;top:10px;left:0;right:0;text-align:center;
 font-size:11px;color:#a59aab;pointer-events:none;z-index:2;
}
.bottom-area{padding-top:12px}
.stats{
 display:flex;justify-content:space-around;align-items:center;
 background:#fffdfb;border:1px solid var(--border);
 border-radius:17px;padding:10px 5px;margin-bottom:11px;
}
.stat{text-align:center;min-width:60px}
.stat strong{display:block;font-size:16px;color:var(--purple-dark)}
.stat span{font-size:10px;color:var(--muted)}
.actions{
 display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
}
.action{
 border-radius:15px;background:#fffdfb;color:var(--text);
 padding:10px 3px 8px;box-shadow:var(--shadow);
 display:flex;flex-direction:column;align-items:center;gap:4px;
 min-height:62px;border:1px solid var(--border);
}
.action .ico{font-size:20px}
.action small{font-size:10px;font-weight:800}
.action:active,.primary:active{transform:scale(.97)}
.action.primary-action{background:#eee6f8;border-color:#e1d4f1;color:#8064ae}
.action.mint-action{background:#e8f5ef;border-color:#d4ece1;color:#578d79}
.action.pink-action{background:#faedf1;border-color:#f2dce4;color:#b6758d}
.footer{
 display:flex;justify-content:space-between;align-items:center;
 padding:10px 4px 2px;color:#a79cab;font-size:10px;
}
.footer button{background:none;color:var(--purple-dark);font-weight:800;font-size:11px}
.modal-backdrop{
 position:absolute;inset:0;background:#51465f66;z-index:20;
 display:none;align-items:center;justify-content:center;padding:18px;
 backdrop-filter:blur(5px);
}
.modal-backdrop.show{display:flex}
.modal{
 width:100%;max-width:390px;max-height:82vh;overflow:auto;
 background:#fffdfb;border-radius:24px;padding:20px;
 box-shadow:0 20px 60px #51465f33;position:relative;
}
.modal h2{margin:0 0 13px;font-size:19px;color:var(--purple-dark)}
.modal p{font-size:13px;line-height:1.9;color:var(--muted)}
.close{
 position:absolute;top:12px;left:12px;width:30px;height:30px;
 border-radius:10px;background:#f1ebf5;color:var(--text);font-size:18px;
}
.primary{
 background:linear-gradient(135deg,#b59bdd,#9478c2);
 color:white;border-radius:14px;padding:12px 17px;font-weight:800;
 box-shadow:0 5px 15px #a58acb44;
}
.secondary{
 background:#f0eaf7;color:#8064ae;border-radius:13px;
 padding:10px 14px;font-weight:800;
}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.shop-item,.rank-item,.achievement-item,.level-item{
 display:flex;align-items:center;justify-content:space-between;
 padding:11px 10px;margin:7px 0;background:#f8f4fa;border-radius:13px;
 font-size:12px;gap:10px;
}
.shop-item button,.level-item button{background:#e8def4;color:#8064ae;border-radius:10px;padding:8px 11px;font-weight:800}
.shop-item button:disabled{opacity:.45}
.language-select{
 width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);
 background:#faf7fb;color:var(--text);font-family:inherit;margin-top:8px;
}
.toast{
 position:absolute;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);
 opacity:0;pointer-events:none;z-index:30;background:#574b65;color:white;
 border-radius:14px;padding:11px 17px;font-size:12px;white-space:nowrap;
 transition:.25s;box-shadow:0 8px 25px #51465f44;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.win-icon{font-size:52px;text-align:center;margin:8px}
.win-title{text-align:center;font-weight:900;font-size:23px;color:var(--mint-dark)}
.win-desc{text-align:center}
@media(max-height:700px){
 .topbar{padding-top:7px}
 .logo{width:34px;height:34px}
 .level-row{padding:4px}
 .bottom-area{padding-top:7px}
 .action{min-height:55px;padding:6px 2px}
 .stats{padding:7px;margin-bottom:7px}
}
</style>
</head>

<div id="app">
 <header class="topbar">

   </div>

 <main>

   </div>
   <div style="width:45%;max-width:190px">

     <span id="progressText" dir="ltr">0%</span>
    </div>
    <div class="progress-wrap"><div class="progress" id="progressBar"></div></div>
   </div>
  </div>

  <section class="game-card">
   <div class="scene-tip" data-i="tip">توپ‌ها را مرتب کن تا هر بطری یک‌رنگ شود</div>
   <canvas id="game3d"></canvas>
  </section>

  <section class="bottom-area">
   <div class="stats">
    <div class="stat"><strong id="movesCount">0</strong><span data-i="moves">حرکت</span></div>
    <div class="stat"><strong id="tubesCount">5</strong><span data-i="tubes">بطری‌ها</span></div>
    <div class="stat"><strong id="bestCount">0</strong><span data-i="best">بهترین</span></div>
    <div class="stat"><strong id="coinStat">100</strong><span data-i="coins">سکه</span></div>
   </div>

   <div class="actions">
    <button class="action primary-action" id="undoBtn"><span class="ico">↶</span><small data-i="undo">برگشت</small></button>
    <button class="action mint-action" id="hintBtn"><span class="ico">💡</span><small data-i="hint">راهنما</small></button>
    <button class="action pink-action" id="restartBtn"><span class="ico">⟳</span><small data-i="restart">شروع مجدد</small></button>
    <button class="action" id="skipBtn"><span class="ico">⏭</span><small data-i="skip">رد مرحله</small></button>
   </div>
   <div class="footer">
    <button id="shopBtn">🛍 <span data-i="shop">فروشگاه</span></button>
    <button id="dailyBtn">🎁 <span data-i="daily">جایزه روزانه</span></button>
    <button id="rankBtn">🏆 <span data-i="ranking">رتبه‌بندی</span></button>
    <button id="achievementBtn">⭐ <span data-i="achievements">دستاوردها</span></button>
   </div>
  </section>
 </main>
</div>

<div class="modal-backdrop" id="modalBackdrop">
 <div class="modal" id="modal">
  <button class="close" id="closeModal">×</button>
  <div id="modalContent"></div>

</div>
<div class="toast" id="toast"></div>

function randomShuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function createLevel(lvl){
 const colorCount=Math.min(3+Math.floor((lvl-1)/12),8);
 const capacity=4;
 const all=[];
 for(let c=0;c<colorCount;c++){
  for(let i=0;i<capacity;i++)all.push(c);
 }
 randomShuffle(all);

 const tubeCount=colorCount+2;
 const result=Array.from({length:tubeCount},()=>[]);
 all.forEach((color,index)=>{
  result[Math.floor(index/capacity)].push(color);
 });

 // توزيع عشوائي إضافي بين الأنابيب مع الحفاظ على السعة
 let flat=result.flat();
 randomShuffle(flat);
 const distributed=Array.from({length:tubeCount},()=>[]);
 flat.forEach((color,index)=>{
  distributed[Math.floor(index/capacity)].push(color);
 });

 return distributed;
}

function loadLevel(){
 tubes=createLevel(level);
 initialState=tubes.map(a=>[...a]);
 history=[];
 selected=-1;
 moves=0;
 won=false;
 hintPair=null;
 updateUI();
 renderScene();
}

function cloneTubes(){
 return tubes.map(tube=>[...tube]);
}

function canMove(from,to){
 if(from===to||from<0||to<0)return false;
 const a=tubes[from],b=tubes[to];
 if(!a||!b||a.length===0||b.length>=4)return false;
 return b.length===0||b[b.length-1]===a[a.length-1];
}

function moveBall(from,to){
 if(!canMove(from,to)){
  showToast(t("invalid"));
  return false;
 }
 history.push(cloneTubes());
 const color=tubes[from].pop();
 tubes[to].push(color);
 moves++;
 totalMoves++;
 selected=-1;
 hintPair=null;
 saveAll();
 updateUI();
 renderScene();
 checkWin();
 return true;
}

function checkWin(){
 const colorCount=Math.min(3+Math.floor((level-1)/12),8);
 const complete=tubes.every(tube=>
  tube.length===0 ||
  (tube.length===4 && tube.every(c=>c===tube[0]))
 );
 const completedColors=tubes.filter(tube=>tube.length===4).length;
 if(complete&&completedColors===colorCount){
  won=true;
  coins+=20;
  best[level]=moves;
  if(level===1)achievements.first=true;
  if(level>=10)achievements.ten=true;
  if(totalMoves>=100)achievements.moves=true;
  if(coins>=500)achievements.rich=true;
  saveAll();
  updateUI();
  setTimeout(showWin,350);
  sendScore();
 }
}

function findHint(){
 for(let i=0;i<tubes.length;i++){
  for(let j=0;j<tubes.length;j++){
   if(canMove(i,j)){
    if(tubes[j].length===0){
     const other=tubes.some((tube,k)=>k!==i&&k!==j&&tube.length>0&&tube[tube.length-1]===tubes[i][tubes[i].length-1]);
     if(other)return [i,j];
    }else{
     return [i,j];
    }
   }
  }
 }
 return null;
}

 renderScene();

/* ---------------- THREE.JS 3D ENGINE ---------------- */

const canvas=$("game3d");
const gameCard=document.querySelector(".game-card");

function init3D(){
 if(!window.THREE){
  gameCard.innerHTML='<div style="padding:30px;text-align:center;color:#8064ae">برای نمایش سه‌بعدی، اتصال اینترنت و بارگذاری Three.js لازم است.</div>';
  return;
 }

 try{
  scene=new THREE.Scene();
  scene.background=new THREE.Color("#f7f3ed");

  camera=new THREE.PerspectiveCamera(36,1,.1,100);
  camera.position.set(0,5.7,10.8);
  camera.lookAt(0,1.05,0);

  renderer=new THREE.WebGLRenderer({
   canvas,
   antialias:true,
   alpha:false,
   powerPreference:"high-performance"
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;

  scene.add(new THREE.HemisphereLight(0xffffff,0xd8cbe3,2.0));

  const keyLight=new THREE.DirectionalLight(0xffffff,2.6);
  keyLight.position.set(-4,8,6);
  keyLight.castShadow=true;
  keyLight.shadow.mapSize.set(1024,1024);
  scene.add(keyLight);

  const fillLight=new THREE.PointLight(0xd9c6ff,1.5,18);
  fillLight.position.set(4,4,3);
  scene.add(fillLight);

  const ground=new THREE.Mesh(
   new THREE.PlaneGeometry(30,30),
   new THREE.MeshStandardMaterial({color:"#f4eff7",roughness:.9})
  );
  ground.rotation.x=-Math.PI/2;
  ground.position.y=-.12;
  ground.receiveShadow=true;
  scene.add(ground);

  raycaster=new THREE.Raycaster();
  pointer=new THREE.Vector2();

  resizeObserver=new ResizeObserver(resize3D);
  resizeObserver.observe(gameCard);
  resize3D();

  canvas.addEventListener("pointerdown",onCanvasPointer);
  animate3D();
 }catch(error){
  console.error(error);
  showToast("خطا در راه‌اندازی موتور سه‌بعدی");
 }
}

function resize3D(){
 if(!renderer||!camera)return;
 const w=gameCard.clientWidth;
 const h=gameCard.clientHeight;
 if(!w||!h)return;
 renderer.setSize(w,h,false);
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 positionCamera();
}

function positionCamera(){
 if(!camera)return;
 const count=tubes.length||5;
 const cols=count<=5?count:Math.ceil(count/2);
 const rows=Math.ceil(count/cols);
 const width=cols*1.15;
 const height=rows*1.1;
 camera.position.set(0,Math.max(5.1,height+3.4),Math.max(9.5,width*.9+5));
 camera.lookAt(0,1.05,0);
}

function makeMaterial(color,roughness=.22,metalness=.05){
 return new THREE.MeshPhysicalMaterial({
  color,
  roughness,
  metalness,
  clearcoat:.9,
  clearcoatRoughness:.12
 });
}

function createTube(index,x,z){
 const group=new THREE.Group();
 group.position.set(x,0,z);
 group.userData.index=index;
 scene.add(group);

 const glassMat=new THREE.MeshPhysicalMaterial({
  color:golden?0xf0d18c:0xffffff,
  metalness:golden?.55:.02,
  roughness:golden?.22:.12,
  transmission:golden?0:.32,
  transparent:true,
  opacity:golden?.92:.27,
  thickness:.35,
  side:THREE.DoubleSide,
  clearcoat:1
 });

 const tubeBody=new THREE.Mesh(
  new THREE.CylinderGeometry(.37,.37,2.45,40,1,true),
  glassMat
 );
 tubeBody.position.y=1.25;
 tubeBody.castShadow=true;
 tubeBody.receiveShadow=true;
 group.add(tubeBody);

 const bottomMat=makeMaterial(golden?"#d7ad52":"#e7dff0",.28,.15);
 const bottom=new THREE.Mesh(
  new THREE.CylinderGeometry(.38,.38,.12,40),
  bottomMat
 );
 bottom.position.y=.07;
 bottom.castShadow=true;
 group.add(bottom);

 const rim=new THREE.Mesh(
  new THREE.TorusGeometry(.37,.045,12,48),
  makeMaterial(golden?"#f5d27b":"#ffffff",.18,.1)
 );
 rim.rotation.x=Math.PI/2;
 rim.position.y=2.48;
 group.add(rim);

 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(.38,.025,10,48),
  makeMaterial("#d8cce6",.3)
 );
 ring.rotation.x=Math.PI/2;
 ring.position.y=.16;
 group.add(ring);

 const glow=new THREE.Mesh(
  new THREE.CylinderGeometry(.43,.43,2.55,32,1,true),
  new THREE.MeshBasicMaterial({
   color:golden?0xe9bd5d:0xc6b1e3,
   transparent:true,opacity:.055,side:THREE.DoubleSide
  })
 );
 glow.position.y=1.25;
 group.add(glow);

 tubeGroups.push(group);
 return group;
}

function createBall(color,x,y,z,index){
 const colors=golden?goldColors:pastel;
 const mesh=new THREE.Mesh(
  new THREE.SphereGeometry(.305,32,24),
  makeMaterial(colors[color%colors.length],.19,.08)
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 mesh.userData={tube:index,color};
 scene.add(mesh);

 const shine=new THREE.Mesh(
  new THREE.SphereGeometry(.07,12,12),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55})
 );
 shine.position.set(-.09,.12,.25);
 mesh.add(shine);

 ballMeshes.push(mesh);
}

function renderScene(){
 if(!scene||!renderer)return;

 tubeGroups.forEach(g=>scene.remove(g));
 ballMeshes.forEach(m=>scene.remove(m));
 tubeGroups=[];
 ballMeshes=[];

 const count=tubes.length;
 const cols=count<=5?count:Math.ceil(count/2);
 const rows=Math.ceil(count/cols);
 const spacing=1.12;
 const totalW=(cols-1)*spacing;
 const totalD=(rows-1)*1.05;

 tubes.forEach((tube,index)=>{
  const row=Math.floor(index/cols);
  const col=index%cols;
  const x=-totalW/2+col*spacing;
  const z=-totalD/2+row*1.05;
  const group=createTube(index,x,z);

  if(index===selected){
   group.position.y=.16;
   group.children.forEach(child=>{
    if(child.material&&child.material.emissive){
     child.material.emissive.set("#b9a0df");
     child.material.emissiveIntensity=.25;
    }
   });
  }
  if(hintPair&&hintPair.includes(index)){
   group.position.y=.1;
  }

  tube.forEach((color,ballIndex)=>{
   const y=.34+ballIndex*.51;
   createBall(color,x,y,z,index);
  });
 });

 positionCamera();
}

function onCanvasPointer(event){
 if(!renderer||!camera)return;
 const rect=canvas.getBoundingClientRect();
 pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
 raycaster.setFromCamera(pointer,camera);

 const targets=[...tubeGroups];
 const hits=raycaster.intersectObjects(targets,true);
 if(!hits.length)return;

 let obj=hits[0].object;
 while(obj&&!Number.isInteger(obj.userData.index))obj=obj.parent;
 if(!obj)return;
 handleTubeTap(obj.userData.index);
}

function handleTubeTap(index){
 if(won)return;
 if(selected===-1){
  if(tubes[index].length===0){showToast(t("select"));return;}
  selected=index;
  renderScene();
  return;
 }
 if(selected===index){
  selected=-1;renderScene();return;
 }
 if(canMove(selected,index)){
  moveBall(selected,index);
 }else if(tubes[index].length>0){
  selected=index;renderScene();
 }else{
  showToast(t("invalid"));
 }
}

function animate3D(){
 requestAnimationFrame(animate3D);
 if(!renderer||!scene||!camera)return;
 const time=performance.now()*.001;
 tubeGroups.forEach((group,index)=>{
  if(index===selected){
   group.position.y=.12+Math.sin(time*4)*.025;
  }
 });
 renderer.render(scene,camera);
}

 <div class="modal-actions"><button class="primary" id="confirmRestart">${t("yes")}</button><button class="secondary" id="cancelRestart">${t("no")}</button></div>`);
 $("confirmRestart").onclick=()=>{restartLevel();closeModal();};
 $("cancelRestart").onclick=closeModal;
};
$("skipBtn").onclick=()=>{
 openModal(`<h2>${t("skipTitle")}</h2><p>${t("skipAsk")}</p>
 <div class="modal-actions"><button class="primary" id="confirmSkip">${t("yes")}</button><button class="secondary" id="cancelSkip">${t("no")}</button></div>`);
 $("confirmSkip").onclick=skipLevel;
 $("cancelSkip").onclick=closeModal;
};

$("languageBtn").onclick=showLanguage;
$("menuBtn").onclick=showMenu;

window.addEventListener("resize",resize3D);

applyLanguage();
init3D();
loadLevel();
updateUI();

})();
