*{box-sizing:border-box}
:root{
--bg:#080e20;
--panel:#141f38;
--panel2:#1c2946;
--text:#fff;
--muted:#94a3bd;
--gold:#ffc857;
--blue:#48b8ff;
--green:#39dca1;
--danger:#ff647c;
}
body{
margin:0;
background:
radial-gradient(ellipse at 50% 0%,#172b51 0%,transparent 55%),
var(--bg);
color:var(--text);
font-family:Tahoma,Arial,sans-serif;
min-height:100vh;
overflow-x:hidden;
}
button,select{font-family:inherit}
button{cursor:pointer}
.app{
max-width:650px;
margin:auto;
padding:14px 14px 30px;
}
.header{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:15px;
}
.logo{
display:flex;
align-items:center;
gap:9px;
font-weight:900;
font-size:17px;
}
.logoIcon{
width:40px;height:40px;
border-radius:13px;
background:linear-gradient(145deg,#38bdf8,#635bff);
display:grid;place-items:center;
font-size:23px;
box-shadow:0 5px 20px #388bff55;
}
.coins{
background:#192742;
border:1px solid #344667;
border-radius:30px;
padding:9px 14px;
color:var(--gold);
font-weight:bold;
display:flex;align-items:center;gap:6px;
}
.topBtns{display:flex;gap:7px}
.smallBtn{
border:1px solid #344667;
background:#192742;
color:white;
border-radius:12px;
padding:9px 11px;
font-size:17px;
}
.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
margin-bottom:13px;
}
.stat{
background:linear-gradient(145deg,#1a2946,#111c32);
border:1px solid #2b3d5d;
border-radius:15px;
padding:11px 5px;
text-align:center;
}
.stat small{color:var(--muted);font-size:11px}
.stat strong{display:block;margin-top:5px;font-size:17px}
.progressBox{
background:#192742;
border-radius:20px;
height:7px;
overflow:hidden;
margin-bottom:18px;
}
.progress{
height:100%;
width:0%;
background:linear-gradient(90deg,#38bdf8,#9a70ff);
transition:.3s;
}
.gamePanel{
background:linear-gradient(150deg,#172642,#111b31);
border:1px solid #304363;
border-radius:23px;
padding:15px 10px 20px;
min-height:380px;
box-shadow:0 15px 40px #0004;
}
.panelTop{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
padding:0 5px;
}
.panelTop strong{font-size:14px}
.panelTop span{font-size:12px;color:var(--muted)}
.bottles{
display:flex;
flex-wrap:wrap;
justify-content:center;
align-items:flex-end;
gap:23px 13px;
padding:15px 5px 22px;
min-height:260px;
perspective:800px;
}
.bottle{
width:49px;
height:170px;
position:relative;
border-radius:10px 10px 17px 17px;
border:2px solid #d9f3ff8c;
border-top:0;
background:linear-gradient(90deg,#ffffff08,#ffffff20 30%,#ffffff08 70%,#ffffff0c);
box-shadow:
inset 5px 0 9px #ffffff15,
inset -5px 0 9px #ffffff12,
0 9px 17px #0005;
overflow:hidden;
transform:rotateX(-3deg);
transition:transform .2s,border-color .2s;
}
.bottle:before{
content:"";
position:absolute;
top:0;
left:9px;
right:9px;
height:8px;
border:2px solid #d9f3ff99;
border-radius:3px 3px 5px 5px;
background:#b9eaff18;
z-index:3;
}
.bottle:after{
content:"";
position:absolute;
top:12px;
bottom:8px;
left:5px;
width:4px;
border-radius:10px;
background:#ffffff24;
pointer-events:none;
z-index:4;
}
.bottle.selected{
border-color:#ffc857;
transform:translateY(-12px) scale(1.05);
box-shadow:0 0 18px #ffc85755;
}
.bottle.locked{opacity:.4}
.balls{
position:absolute;
bottom:5px;
left:3px;right:3px;
display:flex;
flex-direction:column-reverse;
gap:2px;
}
.ball{
width:100%;
height:36px;
border-radius:7px 7px 11px 11px;
position:relative;
box-shadow:
inset 3px 3px 5px #ffffff55,
inset -3px -5px 7px #0005,
0 2px 3px #0005;
}
.ball:after{
content:"";
position:absolute;
width:11px;height:5px;
border-radius:50%;
background:#ffffff70;
top:5px;left:7px;
filter:blur(1px);
}
.bottle.selected .ball{filter:brightness(1.12)}
.controls{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:12px;
}
.action{
border:1px solid #3a5278;
background:#213455;
color:white;
border-radius:14px;
padding:12px 3px;
font-size:12px;
font-weight:bold;
}
.action .ico{display:block;font-size:21px;margin-bottom:5px}
.action.primary{
background:linear-gradient(135deg,#397df7,#7659f5);
border:0;
}
.action.gold{
background:linear-gradient(135deg,#a87519,#edb849);
color:#251800;
border:0;
}
.action:active,.smallBtn:active{transform:scale(.96)}
.bottomGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:14px;
}
.menuCard{
background:#172642;
border:1px solid #304363;
border-radius:17px;
padding:15px;
text-align:center;
cursor:pointer;
}
.menuCard .ico{font-size:25px}
.menuCard strong{display:block;margin-top:7px;font-size:13px}
.menuCard small{color:var(--muted);font-size:10px}
.overlay{
position:fixed;
inset:0;
background:#030817d9;
backdrop-filter:blur(8px);
display:none;
align-items:center;
justify-content:center;
padding:15px;
z-index:20;
}
.overlay.show{display:flex}
.modal{
width:100%;
max-width:420px;
max-height:85vh;
overflow:auto;
background:linear-gradient(150deg,#1b2c4c,#101a2f);
border:1px solid #40577c;
border-radius:23px;
padding:20px;
box-shadow:0 20px 60px #0009;
}
.modalHead{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}
.modalHead h3{margin:0;font-size:17px}
.close{
background:#2b3d5d;color:white;
border:0;border-radius:10px;
width:32px;height:32px;font-size:18px;
}
.item{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:13px;
margin-bottom:9px;
background:#243653;
border-radius:13px;
font-size:13px;
}
.item button{
border:0;border-radius:9px;
padding:9px 13px;
background:#4a81f8;color:white;
font-weight:bold;
}
.item button:disabled{opacity:.4}
.reward{
text-align:center;
font-size:45px;
margin:10px;
}
.notice{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%) translateY(100px);
background:#253c5e;
border:1px solid #54729d;
border-radius:13px;
padding:13px 20px;
font-size:13px;
z-index:50;
transition:.3s;
white-space:nowrap;
}
.notice.show{transform:translateX(-50%) translateY(0)}
select{
background:#243653;
color:white;
border:1px solid #425a7e;
padding:10px;
border-radius:10px;
width:100%;
}
.footer{
text-align:center;
color:#657994;
font-size:10px;
padding:20px;
}
@media(max-width:380px){
.bottles{gap:18px 9px}
.bottle{width:43px;height:155px}

<div class="menuCard" onclick="openModal('achievements')">

if(tg){tg.ready();tg.expand();}

function read(key,fallback){
try{
const value=localStorage.getItem(key);
return value===null?fallback:JSON.parse(value);
}catch(e){return fallback;}
}
function save(key,value){
try{localStorage.setItem(key,JSON.stringify(value));}catch(e){}
}

function t(key){
return translations[language]?.[key]||
translations.en[key]||key;
}

function translate(){
document.documentElement.lang=language;
document.documentElement.dir=
["fa","ar"].includes(language)?"rtl":"ltr";

document.querySelectorAll("[data-i]").forEach(el=>{
el.textContent=t(el.dataset.i);
});
}

function notify(message){
const el=$("notice");
el.textContent=message;
el.classList.add("show");
clearTimeout(notify.timer);
notify.timer=setTimeout(()=>el.classList.remove("show"),2200);
}

function updateStats(){
$("coins").textContent=coins;
$("level").textContent=currentLevel+" / "+TOTAL;
$("moves").textContent=moves;
$("best").textContent=best;
$("progress").style.width=
((currentLevel-1)/TOTAL*100)+"%";
$("levelName").textContent="LEVEL "+currentLevel;
}

function addCoins(amount){
coins+=amount;
save(KEYS.coins,coins);
updateStats();
}

/* =========================
   LEVEL GENERATOR
========================= */

function shuffle(array){
for(let i=array.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[array[i],array[j]]=[array[j],array[i]];
}
return array;
}

function generateLevel(level){
const colorCount=Math.min(3+Math.floor((level-1)/8),8);
let balls=[];

for(let c=0;c<colorCount;c++){
for(let i=0;i<CAP;i++)balls.push(c);
}

shuffle(balls);

const result=[];
for(let i=0;i<colorCount;i++){
result.push(balls.slice(i*CAP,(i+1)*CAP));
}

result.push([]);
result.push([]);

return result;
}

function clone(value){
return JSON.parse(JSON.stringify(value));
}

function loadLevel(){
if(currentLevel>TOTAL){
currentLevel=TOTAL;
notify(t("congratulations"));
}
tubes=generateLevel(currentLevel);
original=clone(tubes);
moves=0;
history=[];
selected=-1;
locked=false;
hintMove=null;
gameStarted=Date.now();
render();
updateStats();
}

function render(){
const container=$("bottles");
container.innerHTML="";

tubes.forEach((tube,index)=>{
const bottle=document.createElement("div");
bottle.className="bottle";
if(selected===index)bottle.classList.add("selected");
if(golden)bottle.style.borderColor="#ffc857";

const balls=document.createElement("div");
balls.className="balls";

tube.forEach(color=>{
const ball=document.createElement("div");
ball.className="ball";
ball.style.background=
golden?
"linear-gradient(145deg,#fff2a3,#d69b22 55%,#7d5110)":
`linear-gradient(145deg,${COLORS[color]},${shade(COLORS[color],-35)})`;
balls.appendChild(ball);
});

bottle.appendChild(balls);
bottle.addEventListener("click",()=>tapBottle(index));
container.appendChild(bottle);
});
}

function shade(hex,amount){
let c=hex.replace("#","");
let n=parseInt(c,16);
let r=Math.max(0,Math.min(255,(n>>16)+amount));
let g=Math.max(0,Math.min(255,((n>>8)&255)+amount));
let b=Math.max(0,Math.min(255,(n&255)+amount));
return "#"+(r<<16|g<<8|b).toString(16).padStart(6,"0");
}

/* =========================
   GAME LOGIC
========================= */

function canMove(from,to){
if(from===to)return false;
const a=tubes[from];
const b=tubes[to];

if(!a.length||b.length>=CAP)return false;
if(!b.length)return true;

return a[a.length-1]===b[b.length-1];
}

function tapBottle(index){
if(locked)return;

if(selected===-1){
if(!tubes[index].length)return;
selected=index;
render();
return;
}

if(selected===index){
selected=-1;
render();
return;
}

if(canMove(selected,index)){
moveBall(selected,index);
return;
}

if(tubes[index].length){
selected=index;
}else{
selected=-1;
}
render();
}

function moveBall(from,to){
history.push({
tubes:clone(tubes),
moves
});

const ball=tubes[from].pop();
tubes[to].push(ball);

moves++;
selected=-1;
hintMove=null;
render();
updateStats();

if(isWon())completeLevel();
}

function isWon(){
return tubes.every(tube=>
tube.length===0||
(tube.length===CAP&&tube.every(c=>c===tube[0]))
);
}

function undo(){
if(!history.length){
notify(t("undoError"));
return;
}
const previous=history.pop();
tubes=previous.tubes;
moves=previous.moves;
selected=-1;
render();
updateStats();
}

function restart(){
tubes=clone(original);
moves=0;
history=[];
selected=-1;
render();
updateStats();
notify(t("restartConfirm"));
}

function findHint(){
for(let i=0;i<tubes.length;i++){
for(let j=0;j<tubes.length;j++){
if(canMove(i,j))return [i,j];
}
}
return null;
}

function hint(){
if(coins<15){
notify(t("notEnough"));
return;
}
const result=findHint();
if(!result){
notify(t("noHint"));
return;
}
addCoins(-15);
hintMove=result;
selected=result[0];
render();
const bottles=document.querySelectorAll(".bottle");
bottles[result[1]]?.classList.add("selected");
notify(t("hintTitle")+": "+(result[0]+1)+" → "+(result[1]+1));
}

function skipLevel(){
if(coins<30){
notify(t("notEnough"));
return;
}
addCoins(-30);
completeLevel(true);
}

/* =========================
   COMPLETION AND SAVING
========================= */

function completeLevel(skipped=false){
if(locked)return;
locked=true;

const earned=20;
addCoins(earned);

if(!completed.includes(currentLevel)){
completed.push(currentLevel);
save(KEYS.rewards,completed);
}

best=Math.max(best,currentLevel);
save(KEYS.best,best);

checkAchievements();
sendScore();

setTimeout(()=>{
if(currentLevel<TOTAL){
currentLevel++;
save(KEYS.progress,currentLevel);
notify(t("win")+" +"+earned+" 🪙");
loadLevel();
}else{
notify(t("congratulations"));
updateStats();
}
},skipped?100:500);
}

function sendScore(){
if(!tg?.initData)return;

fetch("/score",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
initData:tg.initData,
level:currentLevel,
completed:true
})
}).catch(()=>{});
}

/* =========================
   ACHIEVEMENTS
========================= */

function checkAchievements(){
const totalMoves=read("ce_total_moves",0)+moves;
save("ce_total_moves",totalMoves);

const checks=[
{id:"first",condition:completed.length>=1,reward:30},
{id:"ten",condition:completed.length>=10,reward:75},
{id:"fifty",condition:completed.length>=50,reward:150},
{id:"hundred",condition:completed.length>=100,reward:300},
{id:"moves",condition:totalMoves>=100,reward:50},
{id:"coins",condition:coins>=500,reward:100}
];

checks.forEach(item=>{
if(item.condition&&!achievements.includes(item.id)){
achievements.push(item.id);
addCoins(item.reward);
notify("🏆 "+item.id+" +"+item.reward);
}
});

save(KEYS.achievements,achievements);
}

/* =========================
   DAILY REWARD
========================= */

function dailyReward(){
const today=new Date().toLocaleDateString("en-CA");

if(dailyDate===today){
notify(t("dailyDone"));
return;
}

const reward=50+Math.floor(Math.random()*51);
dailyDate=today;
save(KEYS.daily,dailyDate);
addCoins(reward);
notify(t("dailyWin")+" +"+reward+" 🪙");
}

/* =========================
   MODALS
========================= */

function openModal(type){
const overlay=$("overlay");
const title=$("modalTitle");
const body=$("modalBody");

overlay.classList.add("show");
body.innerHTML="";

if(type==="settings"){
title.textContent=t("settings");

body.innerHTML=`
<div class="item">
<span>${t("language")}</span>
<select id="languageSelect">
<option value="fa">فارسی</option>
<option value="en">English</option>
<option value="ar">العربية</option>
<option value="es">Español</option>
<option value="fr">Français</option>
<option value="de">Deutsch</option>
<option value="ru">Русский</option>
</select>
</div>
<div class="item">
<span>${t("gold")}</span>
<span>${golden?t("owned"):"40 🪙"}</span>
</div>
`;
$("languageSelect").value=language;
$("languageSelect").onchange=e=>{
language=e.target.value;
save(KEYS.language,language);
translate();
closeModal();
render();
};
}

if(type==="shop"){
title.textContent=t("shopTitle");
body.innerHTML=`
<div class="item">
<div>💡 ${t("hintBuy")}</div>
<button onclick="buyHint()">${t("buy")}</button>
</div>
<div class="item">
<div>⏭️ ${t("skipBuy")}</div>
<button onclick="closeModal();skipLevel()">${t("buy")}</button>
</div>
<div class="item">
<div>✨ ${t("goldDesc")}</div>
<button onclick="buyGold()">${golden?t("owned"):t("goldBuy")}</button>
</div>
`;
}

if(type==="achievements"){
title.textContent=t("achTitle");

const items=[
["first","🥉","Complete first level",30],
["ten","🥈",t("levelsAch"),75],
["fifty","🥇","Complete 50 levels",150],
["hundred","🏆","Complete 100 levels",300],
["moves","🚶",t("movesAch"),50],
["coins","💰",t("coinsAch"),100]
];

body.innerHTML=items.map(item=>`
<div class="item">
<div>
<div>${item[1]} ${item[2]}</div>
<small style="color:#9aabc4">${item[3]} 🪙</small>
</div>
<strong>${achievements.includes(item[0])?"✅":"🔒"}</strong>
</div>
`).join("");
}

if(type==="leaderboard"){
title.textContent=t("rankTitle");
body.innerHTML="<div style='text-align:center;padding:25px'>⏳</div>";

fetch("/leaderboard")
.then(r=>r.json())
.then(data=>{
let list=Array.isArray(data)?data:
(data.leaderboard||data.data||[]);

if(!list.length){
body.innerHTML=`<div style="text-align:center;padding:25px">${t("noRank")}</div>`;
return;
}

body.innerHTML=list.slice(0,50).map((user,i)=>`
<div class="item">
<div>
<strong>${i+1}. ${escapeHTML(user.name||user.display_name||"Player")}</strong>
</div>
<strong>🏆 ${Number(user.level||0)}</strong>
</div>
`).join("");
})
.catch(()=>{
body.innerHTML=`<div style="text-align:center;padding:25px">${t("noRank")}</div>`;
});
}
}

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function closeModal(){
$("overlay").classList.remove("show");
}

function outsideClose(e){
if(e.target===$("overlay"))closeModal();
}

function buyHint(){
if(coins<15){
notify(t("notEnough"));
return;
}
closeModal();
hint();
}

function buyGold(){
if(golden)return;
if(coins<40){
notify(t("notEnough"));
return;
}
addCoins(-40);
golden=true;
save(KEYS.gold,true);
closeModal();
render();
notify("✨ "+t("owned"));
}

/* =========================
   STARTUP
========================= */

function init(){
currentLevel=Math.max(1,Math.min(TOTAL,currentLevel));
coins=Math.max(0,coins);
translate();
updateStats();
loadLevel();
}

init();
</script>
