<script>
(function(){
"use strict";
const CAP=4,TOTAL=500;
const COLORS=["#ff5c70","#45c7f0","#ffd166","#9b83ff","#53d69a","#ff9f43","#ed75ce","#9bd34d"];
const $=id=>document.getElementById(id);
const tg=window.Telegram?.WebApp||null;
if(tg){try{tg.ready();tg.expand();}catch(e){}}

let level=1,tubes=[],selected=-1,moves=0,history=[],best={};
let coins=Number(localStorage.getItem("ce_coins_v1"))||0;
let claimed=JSON.parse(localStorage.getItem("ce_rewards_v1")||"[]");
let goldenSkin=localStorage.getItem("ce_golden_skin_v1")==="1";
let unlockedAchievements=JSON.parse(localStorage.getItem("ce_achievements_v1")||"[]");
let dailyData=JSON.parse(localStorage.getItem("ce_daily_reward_v1")||'{"lastClaim":"","streak":0}');
let leaderboardSentLevel=0;
const LEVEL_REWARD=20,SKIP_COST=30;
const LEADERBOARD_API="";

if(goldenSkin)document.body.classList.add("golden");

async function submitLeaderboardScore(){
if(!tg?.initData)return;
const completed=claimed.length?Math.max(...claimed.map(Number).filter(Number.isFinite),0):0;
const score=Math.max(completed,level-(solved()?0:1));
if(score<=leaderboardSentLevel)return;
try{
const response=await fetch("/score",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({initData:tg.initData,level:score,completed:claimed.length})
});
if(response.ok)leaderboardSentLevel=score;
}catch(e){}
}

async function loadLeaderboard(){
const list=$("leaderboardList");
list.innerHTML="<p>در حال دریافت رتبه‌ها...</p>";
try{
const response=await fetch("/leaderboard");
if(!response.ok)throw new Error();
const data=await response.json();
if(!Array.isArray(data.players)||!data.players.length){
list.innerHTML="<p>هنوز بازیکنی ثبت نشده است.</p>";return;
}
list.innerHTML="";
data.players.forEach((p,i)=>{
const row=document.createElement("div");row.className="leader-row";
const rank=document.createElement("div");rank.className="leader-rank";rank.textContent="#"+(i+1);
const name=document.createElement("div");name.className="leader-name";
const title=document.createElement("strong");title.textContent=p.name||"بازیکن";
const meta=document.createElement("div");meta.className="leader-meta";meta.textContent=(p.completed||0)+" مرحله تکمیل‌شده";
name.append(title,meta);
const lvl=document.createElement("strong");lvl.textContent="مرحله "+(p.level||0);
row.append(rank,name,lvl);list.appendChild(row);
});
}catch(e){list.innerHTML="<p>ارتباط با سرور برقرار نشد. تنظیمات Cloudflare را بررسی کن.</p>";}
}

const ACHIEVEMENTS=[
{id:"first",count:1,title:"شروع قهرمانی",desc:"اولین مرحله",reward:10,icon:"🌟"},
{id:"five",count:5,title:"پنج‌قدم",desc:"۵ مرحله",reward:25,icon:"🥉"},
{id:"ten",count:10,title:"قهرمان کوچک",desc:"۱۰ مرحله",reward:50,icon:"🥈"},
{id:"twentyfive",count:25,title:"استاد رنگ‌ها",desc:"۲۵ مرحله",reward:100,icon:"🥇"},
{id:"fifty",count:50,title:"قهرمان رنگ‌ها",desc:"۵۰ مرحله",reward:100,icon:"🏆"},
{id:"hundred",count:100,title:"قهرمان بزرگ",desc:"۱۰۰ مرحله",reward:150,icon:"🏆"},
{id:"twofifty",count:250,title:"افسانه رنگ‌ها",desc:"۲۵۰ مرحله",reward:250,icon:"💎"},
{id:"fivehundred",count:500,title:"افسانه Color Escape",desc:"تمام ۵۰۰ مرحله",reward:500,icon:"👑"}
];

function saveCoins(){localStorage.setItem("ce_coins_v1",String(coins));}
function saveProgress(){try{localStorage.setItem("ce_progress_v1",JSON.stringify({level,tubes,moves}));}catch(e){}}
function levelColors(n){if(n<=5)return 3;if(n<=12)return 4;if(n<=20)return 5;if(n<=30)return 6;if(n<=40)return 7;return 8;}
function scrambleSteps(n){if(n<=5)return 12+n*2;if(n<=12)return 25+(n-5)*3;if(n<=20)return 46+(n-12)*3;if(n<=30)return 70+(n-20)*3;if(n<=40)return 100+(n-30)*3;return Math.min(1900,130+(n-40)*4);}

function makeLevel(n){
const count=levelColors(n);
const result=Array.from({length:count+1},(_,i)=>i<count?Array(CAP).fill(i):[]);
let seed=9871+n*7919;
const random=max=>{seed=(seed*16807)%2147483647;return seed%max;};
let previous="";
for(let step=0;step<scrambleSteps(n);step++){
const choices=[];
for(let from=0;from<result.length;from++){
const tube=result[from];if(!tube.length)continue;
const color=tube[tube.length-1];
let run=1;while(run<tube.length&&tube[tube.length-1-run]===color)run++;
for(let to=0;to<result.length;to++){
if(to===from)continue;
const target=result[to];
const reversibleMax=run===tube.length?run:run-1;
const maxMove=Math.min(reversibleMax,CAP-target.length);
if(maxMove<1)continue;
if(target.length&&target[target.length-1]===color)continue;
if(previous===to+":"+from)continue;
choices.push({from,to,maxMove});
}
}
if(!choices.length)break;
const move=choices[random(choices.length)];
const amount=1+random(move.maxMove);
for(let k=0;k<amount;k++)result[move.to].push(result[move.from].pop());
previous=move.from+":"+move.to;
}
return result;
}

function solved(){return tubes.every(t=>t.length===0||(t.length===CAP&&t.every(v=>v===t[0])));}
function snapshot(){history.push({tubes:tubes.map(t=>t.slice()),moves});if(history.length>100)history.shift();}

function checkAchievements(){
let changed=false;
ACHIEVEMENTS.forEach(a=>{
if(claimed.length>=a.count&&!unlockedAchievements.includes(a.id)){
unlockedAchievements.push(a.id);coins+=a.reward;changed=true;
}
});
if(changed){
localStorage.setItem("ce_achievements_v1",JSON.stringify(unlockedAchievements));
saveCoins();
$("message").textContent="🏆 دستاورد جدید باز شد!";
}
}

function renderAchievements(){
const list=$("achievementList");list.innerHTML="";
ACHIEVEMENTS.forEach(a=>{
const unlocked=unlockedAchievements.includes(a.id);
const item=document.createElement("div");
item.className="achievement"+(unlocked?"":" locked");
item.innerHTML="<div>"+a.icon+"</div>";
const title=document.createElement("strong");title.textContent=a.title;
const desc=document.createElement("small");desc.textContent=a.desc+" · "+a.reward+" سکه";
const status=document.createElement("small");status.textContent=unlocked?"باز شده ✓":"قفل است";
item.append(title,desc,status);list.appendChild(item);
});
$("achievementSummary").textContent=unlockedAchievements.length+" از "+ACHIEVEMENTS.length+" دستاورد باز شده";
}

function render(){
saveProgress();
$("level").textContent=level+" / "+TOTAL;
$("moves").textContent=moves;
$("best").textContent=best[level]||"—";
$("coins").textContent=coins;
$("shopCoins").textContent=coins;
$("undo").disabled=!history.length;
$("skip").disabled=level>=TOTAL||coins<SKIP_COST;
$("next").disabled=!solved()||level>=TOTAL;
const root=$("tubes");root.innerHTML="";
tubes.forEach((tube,i)=>{
const el=document.createElement("button");
el.type="button";el.className="tube"+(selected===i?" selected":"");
el.setAttribute("aria-label","Tube "+(i+1));
el.addEventListener("click",()=>tapTube(i));
tube.forEach(color=>{
const liquid=document.createElement("span");
liquid.className="liquid";liquid.style.background=COLORS[color];
el.appendChild(liquid);
});
root.appendChild(el);
});
if(solved()){
submitLeaderboardScore();
$("message").textContent="عالی! همه رنگ‌ها مرتب شدند.";
if(!claimed.includes(level)){
coins+=LEVEL_REWARD;claimed.push(level);
saveCoins();localStorage.setItem("ce_rewards_v1",JSON.stringify(claimed));
}
checkAchievements();
if(!best[level]||moves<best[level]){
best[level]=moves;localStorage.setItem("ce_best",JSON.stringify(best));
}
$("best").textContent=best[level];
$("coins").textContent=coins;
$("winText").textContent="مرحله "+level+" در "+moves+" حرکت کامل شد. ۲۰ سکه جایزه گرفتی!";
$("win").classList.add("show");
}
}

function tapTube(i){
if(solved())return;
if(selected===-1){
if(tubes[i].length){selected=i;$("message").textContent="حالا لوله مقصد را انتخاب کن.";}
else $("message").textContent="اول یک لوله دارای رنگ انتخاب کن.";
render();return;
}
if(selected===i){selected=-1;render();return;}
const from=tubes[selected],to=tubes[i];
if(from.length&&to.length<CAP&&(!to.length||to[to.length-1]===from[from.length-1])){
snapshot();
const color=from[from.length-1];
while(from.length&&from[from.length-1]===color&&to.length<CAP)to.push(from.pop());
moves++;selected=-1;render();
}else if(from.length&&to.length===0){
snapshot();to.push(from.pop());moves++;selected=-1;render();
}else{
selected=i;$("message").textContent="فقط رنگ مشابه یا لوله خالی را انتخاب کن.";render();
}
}

function start(n){
level=n;tubes=makeLevel(n);selected=-1;moves=0;history=[];
$("win").classList.remove("show");
$("message").textContent="رنگ‌ها را مرتب کن.";
render();
}

let saved=null;
try{saved=JSON.parse(localStorage.getItem("ce_progress_v1")||"null");}catch(e){}
try{best=JSON.parse(localStorage.getItem("ce_best")||"{}")||{};}catch(e){best={};}
if(saved&&Number.isInteger(saved.level)&&saved.level>=1&&saved.level<=TOTAL&&Array.isArray(saved.tubes)){
level=saved.level;
tubes=saved.tubes;
moves=Number(saved.moves)||0;
render();
}else start(1);

function localDateKey(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dailyStatus(){
const today=localDateKey();
const y=new Date();y.setDate(y.getDate()-1);
const yesterday=localDateKey(y);
const streak=dailyData.lastClaim===yesterday?(Number(dailyData.streak)||0)+1:1;
return {today,already:dailyData.lastClaim===today,streak,reward:Math.min(10+(streak-1)*5,50)};
}
function updateDaily(){
const d=dailyStatus();
$("dailyReward").textContent=d.reward+" 🪙";
$("dailyStreak").textContent="روز "+d.streak+" از زنجیره ورود";
$("claimDaily").disabled=d.already;
$("claimDaily").textContent=d.already?"جایزه امروز دریافت شده ✓":"دریافت "+d.reward+" سکه";
}
function updateShop(){
$("shopCoins").textContent=coins;
$("buyHint").disabled=coins<15||solved();
$("buySkin").disabled=goldenSkin||coins<40;
$("buySkin").textContent=goldenSkin?"پوسته طلایی فعال است ✓":"خرید پوسته · ۴۰ 🪙";
}
