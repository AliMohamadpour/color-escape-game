
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101426">
<title>Color Escape</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:white;
 font-family:Tahoma,Arial,sans-serif;
 background:radial-gradient(circle at top,#293b68,#101426 65%);
 display:flex;justify-content:center;
}
.app{width:100%;max-width:550px;padding:18px 15px 30px}
header{text-align:center;margin-bottom:18px}
.logo{font-size:34px;font-weight:900;letter-spacing:2px;
 background:linear-gradient(90deg,#35eaff,#a77aff,#ff55bd);
 -webkit-background-clip:text;color:transparent}
.subtitle{color:#aab5d4;font-size:12px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}
.stat{
 background:linear-gradient(145deg,#273453,#18223a);
 border:1px solid #465579;border-radius:15px;
 padding:12px 5px;text-align:center;
 box-shadow:0 5px 0 #0c1426;
}
.stat small{display:block;color:#aab5d4;font-size:11px;margin-bottom:7px}
.stat strong{font-size:19px;color:#55eaff}
.progressbox{
 background:#202b45;border-radius:20px;padding:12px 14px;
 margin-bottom:18px;border:1px solid #39496b
}
.progressinfo{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}
.progress{height:9px;background:#111a2d;border-radius:20px;overflow:hidden}
.progressbar{height:100%;width:0;background:linear-gradient(90deg,#29e5ff,#9c68ff);transition:.3s}
.gamebox{
 background:linear-gradient(145deg,#263653,#151e34);
 border:1px solid #526486;border-radius:23px;padding:15px;
 box-shadow:0 12px 30px #050a18aa;
}
.gamehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.gamehead strong{font-size:15px}
.gamehead span{font-size:11px;color:#aab5d4}
#board{
 width:100%;display:grid;gap:3px;
 background:#0c1426;padding:8px;border-radius:14px;
 border:2px solid #4b6087;
 box-shadow:inset 0 0 20px #0008;
 touch-action:none;
}
.cell{
 aspect-ratio:1;border-radius:4px;
 background:linear-gradient(145deg,#202c48,#172139);
 position:relative;
}
.cell.wall{
 background:linear-gradient(145deg,#52688f,#273754);
 box-shadow:inset 0 2px 3px #ffffff35,inset 0 -3px 3px #101a30;
}
.cell.path{background:linear-gradient(145deg,#111c32,#182641)}
.cell.start{background:#123b48}
.cell.exit{
 background:radial-gradient(circle,#4dffbd,#087c68);
 box-shadow:0 0 13px #30ffb7;
 animation:pulse 1.5s infinite alternate;
}
.cell.player{
 background:radial-gradient(circle at 35% 30%,#fff,#42edff 35%,#1478ff 75%);
 box-shadow:0 0 15px #39eaff,0 0 5px white;
 border-radius:50%;z-index:2;
 transform:scale(.78);
}
@keyframes pulse{to{box-shadow:0 0 22px #30ffb7}}
.message{
 text-align:center;color:#aebcdb;font-size:12px;
 line-height:2;margin:13px 0 5px
}
.controls{display:grid;grid-template-columns:repeat(3,58px);
 justify-content:center;gap:7px;margin:18px auto 5px}
.control{
 height:52px;border:1px solid #607ba8;border-radius:13px;
 color:white;font-size:23px;
 background:linear-gradient(145deg,#405a85,#243653);
 box-shadow:0 4px 0 #10192d;
 cursor:pointer;touch-action:manipulation
}
.control:active{transform:translateY(3px);box-shadow:none}
.empty{visibility:hidden}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}
.action{
 border:0;border-radius:13px;padding:14px 8px;
 color:white;font-weight:bold;font-size:13px;
 background:linear-gradient(135deg,#7656ed,#4a49ba);
 cursor:pointer;
}
.action.secondary{background:linear-gradient(135deg,#148eaa,#17617f)}
.action:active{transform:scale(.97)}
.footer{text-align:center;color:#7888aa;font-size:10px;margin-top:20px}
.overlay{
 position:fixed;inset:0;background:#050918df;
 display:none;align-items:center;justify-content:center;
 padding:20px;z-index:10
}
.popup{
 width:100%;max-width:350px;text-align:center;
 background:linear-gradient(145deg,#293b60,#131d35);
 border:1px solid #657ba6;border-radius:23px;padding:28px 20px;
 box-shadow:0 15px 60px #0009
}
.popup h2{color:#55f3d2}
.popup p{color:#c2cde4;line-height:2;font-size:14px}
.popup button{
 border:0;border-radius:12px;padding:14px 30px;
 color:#101426;background:linear-gradient(90deg,#55edff,#62ffc1);
 font-weight:bold;font-size:15px;cursor:pointer
}
@media(max-width:370px){
 .app{padding:12px 10px}
 .gamebox{padding:10px}
 .controls{grid-template-columns:repeat(3,53px)}
 .control{height:48px}
}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="logo">COLOR ESCAPE</div>
 <div class="subtitle">راه خروج را پیدا کن و قهرمان شو!</div>
</header>

<div class="stats">
 <div class="stat"><small>مرحله</small><strong id="level">1</strong></div>
 <div class="stat"><small>سکه‌ها</small><strong id="coins">0</strong></div>
 <div class="stat"><small>حرکت‌ها</small><strong id="moves">0</strong></div>
</div>

<div class="progressbox">
 <div class="progressinfo">
  <span>پیشرفت بازی</span>
  <span id="percent">0%</span>
 </div>
 <div class="progress"><div class="progressbar" id="bar"></div></div>
</div>

<div class="gamebox">
 <div class="gamehead">
  <strong id="stageTitle">مرحله ۱</strong>
  <span id="difficulty">آسان</span>
 </div>
 <div id="board"></div>
 <div class="message" id="message">
  با حرکت دادن گوی آبی، مسیر خروج سبز را پیدا کن.
 </div>
</div>

<div class="controls">
 <button class="control empty"></button>
 <button class="control" onclick="move(0,-1)">▲</button>
 <button class="control empty"></button>
 <button class="control" onclick="move(-1,0)">◀</button>
 <button class="control" onclick="move(0,1)">▼</button>
 <button class="control" onclick="move(1,0)">▶</button>
</div>

<div class="actions">
 <button class="action" onclick="restart()">شروع دوباره</button>
 <button class="action secondary" onclick="showHelp()">راهنمای بازی</button>
</div>

<div class="footer">COLOR ESCAPE • 500 LEVELS • HAVE FUN</div>
</div>

<div class="overlay" id="overlay">
 <div class="popup">
  <div style="font-size:48px">🏆</div>
  <h2 id="popupTitle">آفرین!</h2>
  <p id="popupText">مرحله را با موفقیت تمام کردی.</p>
  <button onclick="nextLevel()">مرحله بعدی</button>
 </div>
</div>

<script>
const TOTAL=500;
let level=1,coins=0,moves=0;
let maze=[],N=5,SIZE=11;
let player={x:1,y:1};
let finish={x:9,y:9};
let completed=false;

function loadSave(){
 try{
  level=Math.max(1,Math.min(TOTAL,Number(localStorage.getItem("ce_level"))||1));
  coins=Math.max(0,Number(localStorage.getItem("ce_coins"))||0);
 }catch(e){}
}

function save(){
 try{
  localStorage.setItem("ce_level",level);
  localStorage.setItem("ce_coins",coins);
 }catch(e){}
}

function createMaze(){
 N=Math.min(14,5+Math.floor((level-1)/50));
 SIZE=N*2+1;
 maze=Array.from({length:SIZE},()=>Array(SIZE).fill(1));

 let visited=Array.from({length:N},()=>Array(N).fill(false));
 let stack=[[0,0]];
 visited[0][0]=true;
 maze[1][1]=0;

 while(stack.length){
  let [cx,cy]=stack[stack.length-1];
  let dirs=[
   [0,-1],[1,0],[0,1],[-1,0]
  ].sort(()=>Math.random()-.5);
  let found=false;

  for(let [dx,dy] of dirs){
   let nx=cx+dx,ny=cy+dy;
   if(nx>=0&&ny>=0&&nx<N&&ny<N&&!visited[ny][nx]){
    visited[ny][nx]=true;
    maze[cy*2+1+dy][cx*2+1+dx]=0;
    maze[ny*2+1][nx*2+1]=0;
    stack.push([nx,ny]);
    found=true;
    break;
   }
  }
  if(!found)stack.pop();
 }

 player={x:1,y:1};
 finish={x:SIZE-2,y:SIZE-2};
 maze[finish.y][finish.x]=0;
 moves=0;
 completed=false;
 render();
 updateInfo();
}

function render(){
 const board=document.getElementById("board");
 board.innerHTML="";
 board.style.gridTemplateColumns=`repeat(${SIZE},1fr)`;

 for(let y=0;y<SIZE;y++){
  for(let x=0;x<SIZE;x++){
   let cell=document.createElement("div");
   cell.className="cell";
   if(maze[y][x]===1)cell.classList.add("wall");
   else cell.classList.add("path");

   if(x===1&&y===1)cell.classList.add("start");
   if(x===finish.x&&y===finish.y)cell.classList.add("exit");
   if(x===player.x&&y===player.y){
    cell.classList.add("player");
   }
   board.appendChild(cell);
  }
 }
}

function move(dx,dy){
 if(completed)return;
 let nx=player.x+dx,ny=player.y+dy;
 if(nx<0||ny<0||nx>=SIZE||ny>=SIZE)return;
 if(maze[ny][nx]===1)return;

 player.x=nx;
 player.y=ny;
 moves++;
 render();
 updateInfo();

 if(nx===finish.x&&ny===finish.y){
  win();
 }
}

function win(){
 if(completed)return;
 completed=true;
 let reward=10+Math.min(level,40);
 coins+=reward;
 save();
 updateInfo();

 document.getElementById("popupTitle").textContent=
  level===TOTAL?"تو قهرمان بازی شدی!":"مرحله با موفقیت تمام شد!";
 document.getElementById("popupText").textContent=
  `عالی بود! ${moves} حرکت انجام دادی و ${reward} سکه گرفتی.`;
 document.querySelector("#overlay button").textContent=
  level===TOTAL?"بازی دوباره":"مرحله بعدی";
 document.getElementById("overlay").style.display="flex";
}

function nextLevel(){
 document.getElementById("overlay").style.display="none";
 if(level>=TOTAL){
  level=1;
  coins+=100;
 }else{
  level++;
 }
 save();
 createMaze();
}

function restart(){
 createMaze();
 document.getElementById("message").textContent=
  "از نقطه شروع حرکت کن و به خروجی سبز برس.";
}

function updateInfo(){
 document.getElementById("level").textContent=level;
 document.getElementById("coins").textContent=coins;
 document.getElementById("moves").textContent=moves;
 document.getElementById("stageTitle").textContent="مرحله "+level;
 let p=Math.floor((level-1)/TOTAL*100);
 document.getElementById("percent").textContent=p+"%";
 document.getElementById("bar").style.width=p+"%";

 let d=level<=50?"آسان":level<=150?"متوسط":
 level<=300?"سخت":"حرفه‌ای";
 document.getElementById("difficulty").textContent=d;
}

function showHelp(){
 document.getElementById("popupTitle").textContent="راهنمای بازی";
 document.getElementById("popupText").textContent=
 "با دکمه‌های جهت‌دار یا کلیدهای کیبورد حرکت کن. از دیوارها عبور نکن و خودت را به خروجی سبز برسان. هر مرحله سکه جایزه دارد.";
 document.querySelector("#overlay button").textContent="متوجه شدم";
 document.querySelector("#overlay button").onclick=()=>{
  document.getElementById("overlay").style.display="none";
  document.querySelector("#overlay button").onclick=nextLevel;
 };
 document.getElementById("overlay").style.display="flex";
}

document.addEventListener("keydown",e=>{
 const keys={
  ArrowUp:[0,-1],w:[0,-1],
  ArrowDown:[0,1],s:[0,1],
  ArrowLeft:[-1,0],a:[-1,0],
  ArrowRight:[1,0],d:[1,0]
 };
 if(keys[e.key]){
  e.preventDefault();
  move(...keys[e.key]);
 }
});

let touchStart=null;
const board=document.getElementById("board");
board.addEventListener("touchstart",e=>{
 const t=e.touches[0];
 touchStart={x:t.clientX,y:t.clientY};
},{passive:true});

board.addEventListener("touchend",e=>{
 if(!touchStart)return;
 const t=e.changedTouches[0];
 let dx=t.clientX-touchStart.x;
 let dy=t.clientY-touchStart.y;
 if(Math.max(Math.abs(dx),Math.abs(dy))>20){
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);
  else move(0,dy>0?1:-1);
 }
 touchStart=null;
},{passive:true});

loadSave();
createMaze();
</script>
</body>
</html>
