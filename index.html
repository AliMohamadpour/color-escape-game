body{

.progressHead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}
.progressTrack{height:7px;background:#ffffff15;border-radius:10px;overflow:hidden}
.progressFill{

 perspective:800px;
}
.tube{
 position:relative;width:49px;height:158px;
 border:3px solid rgba(195,231,255,.7);
 border-top:0;
 border-radius:0 0 18px 18px;
 background:linear-gradient(90deg,#ffffff08,#ffffff19 45%,#ffffff06);
 box-shadow:
 inset 4px 0 8px #ffffff15,
 inset -4px 0 8px #ffffff12,
 0 9px 15px #0003;
 display:flex;flex-direction:column-reverse;
 align-items:center;justify-content:flex-start;
 padding:5px 3px 7px;gap:2px;
 transform:rotateX(2deg);
 cursor:pointer;
 transition:transform .2s,border-color .2s,filter .2s;
 overflow:hidden;
}
.tube:before{
 content:"";position:absolute;top:0;left:-3px;right:-3px;
 height:5px;border-radius:5px;
 background:linear-gradient(90deg,#c9edff,#fff,#8cb7e5);
 box-shadow:0 2px 5px #0004;
}
.tube.selected{
 border-color:var(--yellow);
 filter:drop-shadow(0 0 8px #ffd36e99);
 transform:translateY(-9px);
}
.tube.complete{
 border-color:var(--cyan);
 filter:drop-shadow(0 0 7px #43e4d055);
}
.ball{
 flex:0 0 32px;width:32px;height:32px;border-radius:50%;
 position:relative;
 border:1px solid #ffffff55;
 box-shadow:
 inset -5px -7px 9px #0003,
 inset 4px 4px 8px #ffffff75,
 0 3px 5px #0004;
 animation:ballIn .2s ease;
}
.ball:after{
 content:"";position:absolute;width:9px;height:5px;
 border-radius:50%;background:#ffffffa0;
 top:5px;left:6px;transform:rotate(-35deg);
}
@keyframes ballIn{
 from{transform:translateY(-12px) scale(.8);opacity:.4}
 to{transform:translateY(0) scale(1);opacity:1}
}
.controls{
 display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px
}
.control{
 border:1px solid var(--line);background:#ffffff0d;
 color:white;border-radius:13px;padding:11px 4px;
 font-size:11px;display:flex;flex-direction:column;
 gap:5px;align-items:center
}
.control b{font-size:19px}
.control.primary{
 background:linear-gradient(135deg,#40cfc1,#408fff);
 color:#07182e;border:0;font-weight:bold
}
.actionGrid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:9px;margin-top:14px
}
.action{
 border:1px solid var(--line);background:#ffffff0c;
 color:white;padding:13px;border-radius:14px;
 font-size:12px;font-weight:bold
}
.action span{margin-left:7px}
.bottomNote{text-align:center;color:var(--muted);font-size:10px;margin-top:14px}
.modal{
 position:fixed;inset:0;background:#050b18c9;
 display:none;align-items:center;justify-content:center;
 padding:17px;z-index:50;backdrop-filter:blur(8px)
}
.modal.show{display:flex}
.modalBox{
 width:100%;max-width:420px;max-height:85vh;overflow:auto;
 background:linear-gradient(150deg,#263e65,#172643);
 border:1px solid #ffffff25;border-radius:23px;
 padding:19px;box-shadow:0 20px 70px #0008;

.modalTitle{

}
.close{

.shopItem{

.menuButton{

.resultIcon{text-align:center;font-size:55px;margin:10px}

/* =========================
   LEVEL GENERATION
========================= */

function seededRandom(seed){
 let x=seed|0;
 return function(){
  x+=0x6D2B79F5;
  let t=x;
  t=Math.imul(t^t>>>15,t|1);
  t^=t+Math.imul(t^t>>>7,t|61);
  return ((t^t>>>14)>>>0)/4294967296;
 };
}

function shuffle(a,rng){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(rng()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function generateLevel(n){
 /*
   تعداد رنگ و شیشه‌ها به تدریج افزایش می‌یابد.
   الگوی ثابت هر مرحله باعث می‌شود Restart همان
   چیدمان قبلی را برگرداند.
 */
 const colorCount=Math.min(6,3+Math.floor((n-1)/80));
 const rng=seededRandom(n*9173+321);

 let colors=COLORS.slice(0,colorCount);
 let balls=[];

 for(let c=0;c<colorCount;c++){
  for(let j=0;j<CAPACITY;j++)balls.push(c);
 }

 shuffle(balls,rng);

 let tubes=[];
 let tubeCount=colorCount+2;

 for(let i=0;i<colorCount;i++){
  tubes.push(balls.slice(i*CAPACITY,(i+1)*CAPACITY));
 }
 for(let i=colorCount;i<tubeCount;i++)tubes.push([]);

 /*
   اگر اتفاقاً یک لوله کامل باشد، توپ‌های آن
   جابه‌جا می‌شوند تا مرحله از حالت حل‌شده خارج شود.
 */
 for(let i=0;i<tubes.length;i++){
  if(tubes[i].length===4 && tubes[i].every(v=>v===tubes[i][0])){
   let j=(i+1)%colorCount;
   let temp=tubes[i][0];
   let k=tubes[j].findIndex(v=>v!==temp);
   if(k>=0){
    [tubes[i][0],tubes[j][k]]=[tubes[j][k],tubes[i][0]];
   }
  }
 }

 return tubes;
}

function cloneBoard(b){return b.map(t=>t.slice())}

/* =========================
   GAME RENDERING
========================= */

function render(){
 const root=document.getElementById("board");
 root.innerHTML="";

 const completeTubes=board.map((t,i)=>isTubeComplete(t)?i:-1);

 board.forEach((tube,index)=>{
  const el=document.createElement("div");
  el.className="tube";
  el.dataset.index=index;

  if(selected===index)el.classList.add("selected");
  if(completeTubes.includes(index))el.classList.add("complete");

  tube.forEach(color=>{
   const ball=document.createElement("div");
   ball.className="ball";
   ball.style.background=goldenSkin
    ? "linear-gradient(135deg,#fff3a3,#e5a92d,#a96a13)"
    : `linear-gradient(135deg,${lighten(COLORS[color])},${COLORS[color]} 55%,${darken(COLORS[color])})`;
   el.appendChild(ball);
  });

  el.addEventListener("click",()=>selectTube(index));
  root.appendChild(el);
 });
}

function lighten(hex){
 let n=parseInt(hex.slice(1),16);
 let r=Math.min(255,((n>>16)&255)+55);
 let g=Math.min(255,((n>>8)&255)+55);
 let b=Math.min(255,(n&255)+55);
 return `rgb(${r},${g},${b})`;
}
function darken(hex){
 let n=parseInt(hex.slice(1),16);
 let r=Math.max(0,((n>>16)&255)-55);
 let g=Math.max(0,((n>>8)&255)-55);
 let b=Math.max(0,(n&255)-55);
 return `rgb(${r},${g},${b})`;
}

function isTubeComplete(t){
 return t.length===CAPACITY && t.every(v=>v===t[0]);
}

/* =========================
   GAME RULES
========================= */

function selectTube(i){
 if(gameWon)return;

 if(selected===-1){
  if(board[i].length===0){
   showToast("ابتدا یک شیشه دارای توپ انتخاب کن");
   return;
  }
  selected=i;render();return;
 }

 if(selected===i){
  selected=-1;render();return;
 }

 const from=board[selected];
 const to=board[i];

 if(from.length===0){
  selected=-1;render();return;
 }

 const color=from[from.length-1];

 if(to.length>=CAPACITY){
  showToast("این شیشه پر است");
  selected=-1;render();return;
 }

 if(to.length>0 && to[to.length-1]!==color){
  if(from.length>0){
   selected=i;
   render();
   showToast("فقط توپ‌های هم‌رنگ را روی هم قرار بده");
   return;
  }
 }

 history.push({
  board:cloneBoard(board),
  moves
 });

 let count=0;
 while(from.length>0 && from[from.length-1]===color && to.length<CAPACITY){
  to.push(from.pop());
  count++;
 }

 moves++;
 totalMoves++;
 selected=-1;

 playSound(520,.06);
 render();updateStats();save();

 if(checkWin())winLevel();
}

function checkWin(){
 return board.every(t=>
  t.length===0 || isTubeComplete(t)
 );
}

function undo(){
 if(!history.length || gameWon){
  showToast("حرکتی برای بازگشت وجود ندارد");
  return;
 }
 let previous=history.pop();
 board=cloneBoard(previous.board);
 moves=previous.moves;
 selected=-1;
 render();updateStats();save();
 playSound(320,.07);
}

function hasLegalMove(){
 for(let i=0;i<board.length;i++){
  if(!board[i].length)continue;
  for(let j=0;j<board.length;j++){
   if(i===j || board[j].length>=CAPACITY)continue;
   let c=board[i][board[i].length-1];
   if(!board[j].length || board[j][board[j].length-1]===c)return true;
  }
 }
 return false;
}

/* =========================
   HINT
========================= */

function findHint(){
 for(let i=0;i<board.length;i++){
  if(!board[i].length)continue;
  const color=board[i][board[i].length-1];

  if(isTubeComplete(board[i]))continue;

  for(let j=0;j<board.length;j++){
   if(i===j || board[j].length>=CAPACITY)continue;

   if(!board[j].length || board[j][board[j].length-1]===color){
    if(board[j].length===0 && board[i].length===1)continue;
    return [i,j];
   }
  }
 }
 return null;
}

function dateKey(){
 return new Date().toISOString().slice(0,10);
}

function dailyReward(){
 let today=dateKey();
 if(lastDaily===today){
  showToast("جایزه امروز را قبلاً دریافت کرده‌ای");
  return;
 }

 const yesterday=new Date();
 yesterday.setDate(yesterday.getDate()-1);
 const yKey=yesterday.toISOString().slice(0,10);

 dailyStreak=lastDaily===yKey?dailyStreak+1:1;
 const reward=Math.min(50,10+(dailyStreak-1)*5);

 coins+=reward;
 lastDaily=today;
 achievements.daily=true;

 save();updateStats();closeModal();
 showToast("🎁 "+reward+" سکه جایزه گرفتی!");
 playSound(700,.15);
}

async function startPayment(product){
 if(!tg?.initData){
  showToast("پرداخت فقط داخل Telegram قابل انجام است");
  return;
 }
 try{
  showToast("در حال آماده‌سازی پرداخت...");
  const response=await fetch("/api/payment",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({product,initData:tg.initData})
  });
  const data=await response.json();
  if(!response.ok||!data.success)throw new Error(data.error||"Payment error");

  const onStatus=status=>{
   if(status==="paid"){
    if(product==="hint")hintOwned=true;
    if(product==="golden")goldenSkin=true;
    save();
    updateStats();
    showToast("پرداخت با موفقیت انجام شد");
    openModal("shop");
   }else if(status==="cancelled"){
    showToast("پرداخت لغو شد");
   }else if(status==="failed"){
    showToast("پرداخت ناموفق بود");
   }
  };

  if(typeof tg.openInvoice==="function")tg.openInvoice(data.invoiceLink,onStatus);
  else tg.openLink(data.invoiceLink);
 }catch(e){
  showToast("شروع پرداخت ناموفق بود");
 }
}

/* =========================
   SOUND
========================= */

let audioContext=null;

function playSound(freq=500,duration=.08){
 if(!soundEnabled)return;
 try{
  audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();
  let osc=audioContext.createOscillator();
  let gain=audioContext.createGain();
  osc.frequency.value=freq;
  osc.type="sine";
  gain.gain.setValueAtTime(.07,audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);
  osc.connect(gain);gain.connect(audioContext.destination);
  osc.start();osc.stop(audioContext.currentTime+duration);
 }catch(e){}
}

   TOAST

function showToast(message){
 const el=document.getElementById("toast");
 el.textContent=message;
 el.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.classList.remove("show"),2300);
}

async function sendScore(){
 try{
  const isTelegram=Boolean(tg?.initData);
  const guestKey="colorEscapeGuestId";
  const guestId=localStorage.getItem(guestKey)||("guest-"+Math.random().toString(36).slice(2)+Date.now().toString(36));
  localStorage.setItem(guestKey,guestId);
  const endpoint=isTelegram?"/score":"/api/progress";
  const response=await fetch(endpoint,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    initData:isTelegram?tg.initData:"",
    telegram_id:isTelegram?undefined:guestId,
    name:userName,
    level:Math.max(1,level),
    completed:completed,
    coins:coins,
    bestMoves:bestMoves[level]||moves
   })
  });
  if(!response.ok)console.warn("Score API:",response.status);
 }catch(e){
  console.warn("Score API unavailable:",e);
 }
}

async function loadLeaderboard(){
 const el=document.getElementById("leaderData");
 if(!el)return;
 try{
  const response=await fetch("/leaderboard");
  if(!response.ok)throw new Error("API error");
  const data=await response.json();
  const list=Array.isArray(data)?data:(data.players||data.results||[]);
  if(!list.length){
   el.textContent="هنوز بازیکنی ثبت نشده است.";
   return;
  }
  el.innerHTML=list.slice(0,10).map((p,i)=>`
   <div class="shopItem">
    <div>${["🥇","🥈","🥉"][i]||"🏅"} ${escapeHTML(p.name||"Player")}</div>
    <strong>مرحله ${Number(p.level)||0}</strong>
   </div>
  `).join("");
 }catch(e){
  el.textContent="ارتباط با جدول رتبه‌بندی برقرار نشد.";
 }
}

function escapeHTML(str){
 return String(str).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
