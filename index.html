<style>
*{box-sizing:border-box}
:root{
 --bg:#101a35;
 --panel:#192747;
 --panel2:#213456;
 --cyan:#43e4d0;

}
body{
 margin:0;

 radial-gradient(ellipse at 15% 10%,#243e71 0,transparent 38%),
 radial-gradient(ellipse at 90% 65%,#29245c 0,transparent 38%),

 font-family:Tahoma,Arial,sans-serif;

}
button{font-family:inherit;cursor:pointer}
button:active{transform:scale(.96)}
.app{max-width:540px;margin:auto;padding:14px 13px 30px}
.top{

}

}

}
.stat span{display:block;color:var(--muted);font-size:10px;margin-bottom:6px}

.progressBox{

}
.progressHead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px}
.progressTrack{height:7px;background:#ffffff15;border-radius:10px;overflow:hidden}

}
.gamePanel{

.gameHead{

 display:flex;flex-wrap:wrap;justify-content:center;
 align-items:flex-end;gap:15px 12px;
 min-height:290px;padding:12px 3px 18px;

}
.tube{
 position:relative;width:49px;height:158px;
 border:3px solid rgba(195,231,255,.7);
 border-top:0;
 border-radius:0 0 18px 18px;
 background:linear-gradient(90deg,#ffffff08,#ffffff19 45%,#ffffff06);
 box-shadow:
 inset 4px 0 8px #ffffff15,
 inset -4px 0 8px #ffffff12,
 0 9px 15px #0003;
 display:flex;flex-direction:column-reverse;
 align-items:center;justify-content:flex-start;
 padding:5px 3px 7px;gap:2px;
 transform:rotateX(2deg);
 cursor:pointer;
 transition:transform .2s,border-color .2s,filter .2s;
 overflow:hidden;
}
.tube:before{
 content:"";position:absolute;top:0;left:-3px;right:-3px;
 height:5px;border-radius:5px;
 background:linear-gradient(90deg,#c9edff,#fff,#8cb7e5);
 box-shadow:0 2px 5px #0004;
}
.tube.selected{
 border-color:var(--yellow);
 filter:drop-shadow(0 0 8px #ffd36e99);
 transform:translateY(-9px);
}
.tube.complete{
 border-color:var(--cyan);
 filter:drop-shadow(0 0 7px #43e4d055);
}
.ball{
 flex:0 0 32px;width:32px;height:32px;border-radius:50%;
 position:relative;
 border:1px solid #ffffff55;
 box-shadow:
 inset -5px -7px 9px #0003,
 inset 4px 4px 8px #ffffff75,
 0 3px 5px #0004;
 animation:ballIn .2s ease;
}
.ball:after{
 content:"";position:absolute;width:9px;height:5px;
 border-radius:50%;background:#ffffffa0;
 top:5px;left:6px;transform:rotate(-35deg);
}
@keyframes ballIn{
 from{transform:translateY(-12px) scale(.8);opacity:.4}
 to{transform:translateY(0) scale(1);opacity:1}
}
.controls{
 display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px
}
.control{
 border:1px solid var(--line);background:#ffffff0d;
 color:white;border-radius:13px;padding:11px 4px;
 font-size:11px;display:flex;flex-direction:column;
 gap:5px;align-items:center
}
.control b{font-size:19px}
.control.primary{
 background:linear-gradient(135deg,#40cfc1,#408fff);
 color:#07182e;border:0;font-weight:bold
}
.actionGrid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:9px;margin-top:14px
}
.action{
 border:1px solid var(--line);background:#ffffff0c;
 color:white;padding:13px;border-radius:14px;
 font-size:12px;font-weight:bold
}
.action span{margin-left:7px}
.bottomNote{text-align:center;color:var(--muted);font-size:10px;margin-top:14px}
.modal{
 position:fixed;inset:0;background:#050b18c9;
 display:none;align-items:center;justify-content:center;
 padding:17px;z-index:50;backdrop-filter:blur(8px)
}
.modal.show{display:flex}
.modalBox{
 width:100%;max-width:420px;max-height:85vh;overflow:auto;
 background:linear-gradient(150deg,#263e65,#172643);
 border:1px solid #ffffff25;border-radius:23px;
 padding:19px;box-shadow:0 20px 70px #0008;
}
.modalTitle{
 display:flex;justify-content:space-between;align-items:center;
 font-size:18px;font-weight:bold;margin-bottom:17px
}
.close{
 border:0;background:#ffffff13;color:white;
 border-radius:10px;width:33px;height:33px;font-size:18px
}
.shopItem{
 display:flex;justify-content:space-between;align-items:center;
 padding:13px;background:#ffffff0b;border:1px solid var(--line);
 border-radius:14px;margin-bottom:9px;gap:10px
}
.shopItem small{display:block;color:var(--muted);margin-top:5px;font-size:10px}
.buy{
 background:linear-gradient(135deg,#44dfce,#4b9fff);
 border:0;color:#09213a;border-radius:10px;
 padding:9px 12px;font-weight:bold;white-space:nowrap
}
.menuButton{
 width:100%;padding:13px;border-radius:13px;
 border:1px solid var(--line);background:#ffffff0d;
 color:white;margin-bottom:8px;text-align:right
}
.resultIcon{text-align:center;font-size:55px;margin:10px}
.resultText{text-align:center;font-size:20px;font-weight:bold}
.resultSub{text-align:center;color:var(--muted);font-size:12px;margin:10px}
.primaryButton{
 width:100%;padding:14px;border:0;border-radius:13px;
 background:linear-gradient(110deg,var(--cyan),var(--blue));
 color:#07172d;font-weight:900;font-size:14px;margin-top:13px
}
.toast{
 position:fixed;bottom:25px;left:50%;transform:translateX(-50%);
 background:#263e65;border:1px solid #ffffff25;
 padding:12px 18px;border-radius:13px;font-size:12px;
 opacity:0;pointer-events:none;transition:.25s;z-index:100;
 white-space:nowrap
}
.toast.show{opacity:1;bottom:40px}
@media(max-width:360px){
 .tube{width:43px;height:145px}
 .ball{width:28px;height:28px;flex-basis:28px}
 #board{gap:13px 9px}
}
</style>

<body>
<div class="app">

<header class="top">
 <div class="logo">
  <div class="logoIcon">🎨</div>
  <div>
   <h1>COLOR ESCAPE</h1>
   <small>COLOR SORT PUZZLE</small>
  </div>
 </div>
 <div class="topBtns">
  <button class="iconBtn" onclick="openModal('settings')">⚙️</button>
  <button class="iconBtn" onclick="openModal('leaderboard')">🏆</button>
 </div>

 <div class="stat"><span>🪙 سکه‌ها</span><strong id="coins">100</strong></div>

</section>

<section class="progressBox">
 <div class="progressHead">
  <span>پیشرفت بازی</span>
  <span id="progressText">0%</span>
 </div>
 <div class="progressTrack"><div class="progressFill" id="progressFill"></div></div>
</section>

<main class="gamePanel">
 <div class="gameHead">
  <div>
   <h2>مرتب‌سازی رنگ‌ها</h2>
   <small>توپ‌های هم‌رنگ را کنار هم قرار بده</small>
  </div>

 </div>

 <div class="controls">
  <button class="control" onclick="undo()"><b>↶</b>بازگشت</button>

<div class="actionGrid">

</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
 <div class="modalBox">
  <div class="modalTitle">
   <span id="modalTitle">منو</span>
   <button class="close" onclick="closeModal()">×</button>
  </div>
  <div id="modalContent"></div>
 </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================
   CONFIGURATION
========================= */

const MAX_LEVEL=500;
const CAPACITY=4;
const SAVE_KEY="colorEscapeUltimateV5";

const COLORS=[
 "#ff6688","#45c9ed","#ffd45f","#a68bff",
 "#53dfa5","#ff9c50","#ed75d5","#8bdcfa",
 "#b5e56b","#ff8068"
];

const tg=window.Telegram?.WebApp;
try{
 if(tg){tg.ready();tg.expand();}
}catch(e){}

let userName="Player";
try{
 userName=tg?.initDataUnsafe?.user?.first_name || "Player";
}catch(e){}

const languages={
 fa:{name:"فارسی",dir:"rtl"},
 en:{name:"English",dir:"ltr"},
 ar:{name:"العربية",dir:"rtl"},
 tr:{name:"Türkçe",dir:"ltr"},
 es:{name:"Español",dir:"ltr"},
 ru:{name:"Русский",dir:"ltr"},
 fr:{name:"Français",dir:"ltr"}
};

let language="fa";
let level=1,coins=100,moves=0;
let board=[],initialBoard=[],history=[];
let selected=-1,gameWon=false;
let soundEnabled=true,goldenSkin=false;
let hintOwned=false;
let dailyStreak=0,lastDaily="";
let achievements={};
let totalMoves=0;
let completed=0;
let bestMoves={};
let unlocked=1;
let toastTimer=null;

/* =========================
   STORAGE
========================= */

function loadSave(){
 try{
  const d=JSON.parse(localStorage.getItem(SAVE_KEY)||"{}");
  level=Math.min(MAX_LEVEL,Math.max(1,d.level||1));
  coins=Math.max(0,d.coins??100);
  unlocked=Math.max(1,d.unlocked||level);
  completed=d.completed||0;
  dailyStreak=d.dailyStreak||0;
  lastDaily=d.lastDaily||"";
  achievements=d.achievements||{};
  totalMoves=d.totalMoves||0;
  bestMoves=d.bestMoves||{};
  goldenSkin=!!d.goldenSkin;
  language=d.language||"fa";
  soundEnabled=d.soundEnabled!==false;
  if(!languages[language])language="fa";
 }catch(e){}
}

function save(){
 try{
  localStorage.setItem(SAVE_KEY,JSON.stringify({
   level,coins,unlocked,completed,dailyStreak,lastDaily,
   achievements,totalMoves,bestMoves,goldenSkin,
   language,soundEnabled
  }));
 }catch(e){}
}

function updateStats(){
 document.getElementById("coins").textContent=coins;
 document.getElementById("levelStat").textContent=level+" / "+MAX_LEVEL;
 document.getElementById("levelTag").textContent="LEVEL "+String(level).padStart(2,"0");
 document.getElementById("moves").textContent=moves;
 let p=Math.floor(completed/MAX_LEVEL*100);
 document.getElementById("progressText").textContent=p+"%";
 document.getElementById("progressFill").style.width=p+"%";
}

/* =========================
   LEVEL GENERATION
========================= */

function seededRandom(seed){
 let x=seed|0;
 return function(){
  x+=0x6D2B79F5;
  let t=x;
  t=Math.imul(t^t>>>15,t|1);
  t^=t+Math.imul(t^t>>>7,t|61);
  return ((t^t>>>14)>>>0)/4294967296;
 };
}

function shuffle(a,rng){
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(rng()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}

function generateLevel(n){
 /*
   تعداد رنگ و شیشه‌ها به تدریج افزایش می‌یابد.
   الگوی ثابت هر مرحله باعث می‌شود Restart همان
   چیدمان قبلی را برگرداند.
 */
 const colorCount=Math.min(6,3+Math.floor((n-1)/80));
 const rng=seededRandom(n*9173+321);

 let colors=COLORS.slice(0,colorCount);
 let balls=[];

 for(let c=0;c<colorCount;c++){
  for(let j=0;j<CAPACITY;j++)balls.push(c);
 }

 shuffle(balls,rng);

 let tubes=[];
 let tubeCount=colorCount+2;

 for(let i=0;i<colorCount;i++){
  tubes.push(balls.slice(i*CAPACITY,(i+1)*CAPACITY));
 }
 for(let i=colorCount;i<tubeCount;i++)tubes.push([]);

 /*
   اگر اتفاقاً یک لوله کامل باشد، توپ‌های آن
   جابه‌جا می‌شوند تا مرحله از حالت حل‌شده خارج شود.
 */
 for(let i=0;i<tubes.length;i++){
  if(tubes[i].length===4 && tubes[i].every(v=>v===tubes[i][0])){
   let j=(i+1)%colorCount;
   let temp=tubes[i][0];
   let k=tubes[j].findIndex(v=>v!==temp);
   if(k>=0){
    [tubes[i][0],tubes[j][k]]=[tubes[j][k],tubes[i][0]];
   }
  }
 }

 return tubes;
}

function cloneBoard(b){return b.map(t=>t.slice())}

function newLevel(){
 board=generateLevel(level);
 initialBoard=cloneBoard(board);
 moves=0;history=[];selected=-1;gameWon=false;
 render();
 updateStats();
 save();
}

function restart(){
 if(gameWon)return;
 board=cloneBoard(initialBoard);
 history=[];moves=0;selected=-1;
 render();updateStats();
 showToast("مرحله از نو شروع شد");
}

/* =========================
   GAME RENDERING
========================= */

function render(){
 const root=document.getElementById("board");
 root.innerHTML="";

 const completeTubes=board.map((t,i)=>isTubeComplete(t)?i:-1);

 board.forEach((tube,index)=>{
  const el=document.createElement("div");
  el.className="tube";
  el.dataset.index=index;

  if(selected===index)el.classList.add("selected");
  if(completeTubes.includes(index))el.classList.add("complete");

  tube.forEach(color=>{
   const ball=document.createElement("div");
   ball.className="ball";
   ball.style.background=goldenSkin
    ? "linear-gradient(135deg,#fff3a3,#e5a92d,#a96a13)"
    : `linear-gradient(135deg,${lighten(COLORS[color])},${COLORS[color]} 55%,${darken(COLORS[color])})`;
   el.appendChild(ball);
  });

  el.addEventListener("click",()=>selectTube(index));
  root.appendChild(el);
 });
}

function lighten(hex){
 let n=parseInt(hex.slice(1),16);
 let r=Math.min(255,((n>>16)&255)+55);
 let g=Math.min(255,((n>>8)&255)+55);
 let b=Math.min(255,(n&255)+55);
 return `rgb(${r},${g},${b})`;
}
function darken(hex){
 let n=parseInt(hex.slice(1),16);
 let r=Math.max(0,((n>>16)&255)-55);
 let g=Math.max(0,((n>>8)&255)-55);
 let b=Math.max(0,(n&255)-55);
 return `rgb(${r},${g},${b})`;
}

function isTubeComplete(t){
 return t.length===CAPACITY && t.every(v=>v===t[0]);
}

/* =========================
   GAME RULES
========================= */

function selectTube(i){
 if(gameWon)return;

 if(selected===-1){
  if(board[i].length===0){
   showToast("ابتدا یک شیشه دارای توپ انتخاب کن");
   return;
  }
  selected=i;render();return;
 }

 if(selected===i){
  selected=-1;render();return;
 }

 const from=board[selected];
 const to=board[i];

 if(from.length===0){
  selected=-1;render();return;
 }

 const color=from[from.length-1];

 if(to.length>=CAPACITY){
  showToast("این شیشه پر است");
  selected=-1;render();return;
 }

 if(to.length>0 && to[to.length-1]!==color){
  if(from.length>0){
   selected=i;
   render();
   showToast("فقط توپ‌های هم‌رنگ را روی هم قرار بده");
   return;
  }
 }

 history.push({
  board:cloneBoard(board),
  moves
 });

 let count=0;
 while(from.length>0 && from[from.length-1]===color && to.length<CAPACITY){
  to.push(from.pop());
  count++;
 }

 moves++;
 totalMoves++;
 selected=-1;

 playSound(520,.06);
 render();updateStats();save();

 if(checkWin())winLevel();
}

function checkWin(){
 return board.every(t=>
  t.length===0 || isTubeComplete(t)
 );
}

function undo(){
 if(!history.length || gameWon){
  showToast("حرکتی برای بازگشت وجود ندارد");
  return;
 }
 let previous=history.pop();
 board=cloneBoard(previous.board);
 moves=previous.moves;
 selected=-1;
 render();updateStats();save();
 playSound(320,.07);
}

function hasLegalMove(){
 for(let i=0;i<board.length;i++){
  if(!board[i].length)continue;
  for(let j=0;j<board.length;j++){
   if(i===j || board[j].length>=CAPACITY)continue;
   let c=board[i][board[i].length-1];
   if(!board[j].length || board[j][board[j].length-1]===c)return true;
  }
 }
 return false;
}

/* =========================
   HINT
========================= */

function findHint(){
 for(let i=0;i<board.length;i++){
  if(!board[i].length)continue;
  const color=board[i][board[i].length-1];

  if(isTubeComplete(board[i]))continue;

  for(let j=0;j<board.length;j++){
   if(i===j || board[j].length>=CAPACITY)continue;

   if(!board[j].length || board[j][board[j].length-1]===color){
    if(board[j].length===0 && board[i].length===1)continue;
    return [i,j];
   }
  }
 }
 return null;
}

function hint(){
 if(gameWon)return;

 if(coins<15){
  showToast("برای راهنما ۱۵ سکه لازم داری");
  return;
 }

 const h=findHint();
 if(!h){
  showToast("حرکت مناسبی پیدا نشد؛ مرحله را بررسی کن");
  return;
 }

 coins-=15;
 selected=h[0];
 render();
 save();updateStats();
 showToast("شیشه روشن شده را به شیشه مقصد منتقل کن");
}

/* =========================
   WIN / SKIP
========================= */

function winLevel(){
 if(gameWon)return;
 gameWon=true;

 completed=Math.max(completed,level);
 unlocked=Math.max(unlocked,level+1);
 coins+=20;
 achievements.firstWin=true;
 achievements.win10=completed>=10;
 achievements.win50=completed>=50;
 achievements.win100=completed>=100;
 achievements.win500=completed>=500;

 bestMoves[level]=Math.min(bestMoves[level]||999,moves);

 save();updateStats();
 playSound(800,.15);

 setTimeout(()=>{
  openResult("🎉","مرحله با موفقیت تمام شد!","+20 سکه");
 },250);

 sendScore();
}

function openResult(icon,title,sub){
 document.getElementById("modalTitle").textContent="آفرین!";
 document.getElementById("modalContent").innerHTML=`
  <div class="resultIcon">${icon}</div>
  <div class="resultText">${title}</div>
  <div class="resultSub">${sub}</div>
  <div class="resultSub">تعداد حرکات: ${moves}</div>
  <button class="primaryButton" onclick="nextLevel()">مرحله بعدی ←</button>
 `;
 document.getElementById("modal").classList.add("show");
}

function nextLevel(){
 closeModal();
 if(level>=MAX_LEVEL){
  showToast("تبریک! تمام ۵۰۰ مرحله را گذراندی");
  return;
 }
 level++;
 newLevel();
}

function skipLevel(){
 if(gameWon)return;
 if(coins<30){
  showToast("برای رد مرحله ۳۰ سکه نیاز داری");
  return;
 }
 if(!confirm("با پرداخت ۳۰ سکه مرحله رد شود؟"))return;
 coins-=30;
 completed=Math.max(completed,level);
 unlocked=Math.max(unlocked,level+1);
 level=Math.min(MAX_LEVEL,level+1);
 save();newLevel();
 showToast("مرحله رد شد");
}

/* =========================
   DAILY REWARD
========================= */

function dateKey(){
 return new Date().toISOString().slice(0,10);
}

function dailyReward(){
 let today=dateKey();
 if(lastDaily===today){
  showToast("جایزه امروز را قبلاً دریافت کرده‌ای");
  return;
 }

 const yesterday=new Date();
 yesterday.setDate(yesterday.getDate()-1);
 const yKey=yesterday.toISOString().slice(0,10);

 dailyStreak=lastDaily===yKey?dailyStreak+1:1;
 const reward=Math.min(50,10+(dailyStreak-1)*5);

 coins+=reward;
 lastDaily=today;
 achievements.daily=true;

 save();updateStats();closeModal();
 showToast("🎁 "+reward+" سکه جایزه گرفتی!");
 playSound(700,.15);
}

/* =========================
   SHOP
========================= */

function buyHint(){
 if(coins<15){
  showToast("سکه کافی نیست");return;
 }
 coins-=15;
 save();updateStats();closeModal();
 hint();
}

function buyGolden(){
 if(goldenSkin){
  showToast("پوسته طلایی فعال است");return;
 }
 if(coins<40){
  showToast("۴۰ سکه لازم داری");return;
 }
 coins-=40;goldenSkin=true;
 save();updateStats();render();closeModal();
 showToast("✨ پوسته طلایی فعال شد");
}

/* =========================
   SOUND
========================= */

let audioContext=null;

function playSound(freq=500,duration=.08){
 if(!soundEnabled)return;
 try{
  audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();
  let osc=audioContext.createOscillator();
  let gain=audioContext.createGain();
  osc.frequency.value=freq;
  osc.type="sine";
  gain.gain.setValueAtTime(.07,audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);
  osc.connect(gain);gain.connect(audioContext.destination);
  osc.start();osc.stop(audioContext.currentTime+duration);
 }catch(e){}
}

/* =========================
   TOAST
========================= */

function showToast(message){
 const el=document.getElementById("toast");
 el.textContent=message;
 el.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>el.classList.remove("show"),2300);
}

/* =========================
   CLOUDFLARE API
========================= */

async function sendScore(){
 try{
  if(!userName)return;
  const response=await fetch("/score",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    name:userName,
    level:completed,
    completed:completed,
    moves:totalMoves,
    coins:coins
   })
  });
  if(!response.ok)console.warn("Score API:",response.status);
 }catch(e){
  console.warn("Score API unavailable:",e);
 }
}

async function loadLeaderboard(){
 const el=document.getElementById("leaderData");
 if(!el)return;
 try{
  const response=await fetch("/leaderboard");
  if(!response.ok)throw new Error("API error");
  const data=await response.json();
  const list=Array.isArray(data)?data:(data.players||data.results||[]);
  if(!list.length){
   el.textContent="هنوز بازیکنی ثبت نشده است.";
   return;
  }
  el.innerHTML=list.slice(0,10).map((p,i)=>`
   <div class="shopItem">
    <div>${["🥇","🥈","🥉"][i]||"🏅"} ${escapeHTML(p.name||"Player")}</div>
    <strong>مرحله ${Number(p.level)||0}</strong>
   </div>
  `).join("");
 }catch(e){
  el.textContent="ارتباط با جدول رتبه‌بندی برقرار نشد.";
 }
}

function escapeHTML(str){
 return String(str).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
